<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Zemin: merkezden kenara hafif koyulaşan lacivert (premium derinlik) -->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#10223C"/>
      <stop offset="100%" stop-color="#070F1D"/>
    </radialGradient>
    <!-- Damla: üstte açık, altta doygun mavi — "sıvı" hissi -->
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0066FF"/>
      <stop offset="55%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <radialGradient id="hl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  <clipPath id="dropclip"><path d="M512,194
           C512,194 282,468 282,600
           A230,230 0 1 0 742,600
           C742,468 512,194 512,194 Z"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Damla: tepe 194, taban dairesi r=230 @y=600 → yükseklik ≈636px = %62 doluluk -->
  <path d="M512,194
           C512,194 282,468 282,600
           A230,230 0 1 0 742,600
           C742,468 512,194 512,194 Z"
        fill="url(#drop)"/>

  <!-- Mikro-highlight: sol-üst iç parlama, tek nokta -->
  <ellipse cx="420" cy="430" rx="86" ry="120" fill="url(#hl)" transform="rotate(-18 420 430)" clip-path="url(#dropclip)"/>
</svg>
